name: Test

# ── Why this file exists ─────────────────────────────────────────────────────
# It did not, for three releases. There were twelve PHPUnit classes, three
# integration scripts, and a deploy workflow whose comments said VersionTest
# "already enforces three of them against each other on every push" — which was
# not true of anything, because nothing ran on push. A test suite nobody runs is
# documentation with a misleading file extension.
#
# ── What runs here, and what deliberately does not ───────────────────────────
# The unit suite, on every push and pull request, across the PHP versions the
# plugin claims to support. tests/bootstrap.php stubs the WordPress surface the
# pure logic touches, so this needs no database and no WordPress checkout, and
# the whole thing finishes in well under a second.
#
# The integration scripts under tests/integration/ need a running WordPress and
# are run separately below, under wp-env, only on pull requests and pushes to
# main — they take minutes rather than milliseconds, and the unit suite is what
# should fail fast on a work-in-progress branch.
#
# ── Why the unit matrix does not start at 7.4 ────────────────────────────────
# The plugin supports PHP 7.4. PHPUnit 11 requires 8.2, and the suite uses
# attribute-based data providers, which 7.4 parses as comments. Running the
# tests on 7.4 would mean pinning PHPUnit 9 and rewriting the providers as
# annotations — paying a real cost in the test suite to assert something the
# tests are not the right tool for anyway.
#
# So the split is honest rather than convenient: the `unit` job proves the logic
# is right, on the PHP versions that can run the tests, and the `compat` job
# proves the source actually runs on 7.4 — with PHPCompatibilityWP, which knows
# what a match expression and a nullsafe operator are, rather than with `php -l`,
# which would happily pass a file full of 8.0-only function calls.
#
# If that split ever stops being true, the failure is loud: `compat` reads the
# floor from the plugin header.
#
# ── Action versions ──────────────────────────────────────────────────────────
# Pinned to floating majors, and deliberately current. GitHub retires the Node
# runtime an action declares, and for a while before it does it forces the
# action onto the newer one and annotates every job saying so. That warning is
# the whole notice period. It costs nothing here — but deploy.yml's `deploy` job
# `needs` this workflow, so the day forcing turns into failing, the thing that
# breaks is not a test run, it is the ability to publish to WordPress.org, and
# the release that discovers it is one already tagged.
#
# So these move together with the ones in deploy.yml, which carries a checkout
# of its own. Two files, one decision.
#
# checkout v5.1/v6.1/v7 changed fork-PR checkout under `pull_request_target` and
# `workflow_run`. Neither is used here — this file triggers on `pull_request`,
# which is the safe one — so that break does not reach us. Read it again anyway
# before the next bump: it is exactly the sort of change that is harmless right
# up until somebody adds a trigger.
#
# setup-node v6 narrowed automatic caching to npm. No `cache` input is set
# below, so there is nothing to narrow. The `node-version` pinned there is a
# separate question from the version of the action reading it.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

  # ── Called by deploy.yml before it publishes ────────────────────────────────
  # A release fires on a tag, and none of the triggers above match a tag, so
  # until this existed nothing here had run against the exact commit being
  # published. deploy.yml now calls this file rather than carrying its own copy
  # of the suite — two copies of a five-job matrix is precisely the drift the
  # rest of this repository goes out of its way to avoid.
  #
  # Note what this means for the `integration` job below: when called, the
  # github context is the caller's, so `github.event_name` is `release` (or
  # `workflow_dispatch`) rather than `push`, and the condition there lets
  # integration run. A release therefore gets the full suite, including the
  # wp-env scripts that ordinary branch pushes skip. That is the intent — it is
  # the last chance to catch anything before it reaches WordPress.org.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the unit suite
        run: composer run test

  compat:
    name: Minimum PHP compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Read from the header rather than written here, so the two cannot drift.
      # Noticing months later that the plugin claims 7.4 while being checked
      # against 8.1 is exactly the class of thing this whole file exists to stop.
      - name: Read the supported floor from the plugin header
        id: floor
        run: |
          version=$(grep -m1 -oE '^ \* Requires PHP:[[:space:]]*\S+' groundwork-common-post-portal.php | awk '{print $NF}')
          if [ -z "$version" ]; then
            echo "::error::The plugin header has no Requires PHP line."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # phpcompat.xml.dist names what to check and carries the same floor as a
      # default, so `composer compat` locally and this step check the same files.
      # Only the floor is overridden here, from the header read above — the
      # ruleset's copy is the fallback for a run with no arguments, not a second
      # source of truth.
      - name: Check the source runs on it
        run: |
          vendor/bin/phpcs -p \
            --standard=phpcompat.xml.dist \
            --runtime-set testVersion "${{ steps.floor.outputs.version }}-"

  standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # There are around twenty phpcs:ignore annotations across inc/, each with
      # a written justification. Until this ran, nothing verified that any of
      # them still silenced something real, and nobody could reproduce the run a
      # directory reviewer makes.
      - name: Run PHPCS
        run: composer run lint

  # ── The two versions readme.txt promises ────────────────────────────────────
  # Read out of readme.txt rather than written here, so "Requires at least" and
  # "Tested up to" are claims CI enforces instead of numbers somebody typed once
  # and never checked. Bump either header and the matrix follows.
  versions:
    name: Read the supported WordPress versions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          min=$(grep -m1 -oE '^Requires at least:[[:space:]]*\S+' readme.txt | awk '{print $NF}')
          max=$(grep -m1 -oE '^Tested up to:[[:space:]]*\S+' readme.txt | awk '{print $NF}')

          if [ -z "$min" ] || [ -z "$max" ]; then
            echo "::error::readme.txt is missing Requires at least or Tested up to."
            exit 1
          fi

          echo "minimum=$min tested=$max"
          printf 'list=["%s","%s"]\n' "$min" "$max" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration (WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    needs: versions
    # Minutes rather than milliseconds, so not on every push to every branch.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        wp: ${{ fromJSON(needs.versions.outputs.list) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # ── The WordPress version under test ───────────────────────────────────
      # `core` pins it. wp-env takes null to mean latest, which is what the
      # maximum in the matrix should follow.
      #
      # There is no mail wiring here any more, and that is the point. A third of
      # phase3's assertions are about a reminder going out or an invitation
      # being recorded, all through wp_mail(), which returns false in a
      # container with no MTA — the first CI run failed six of them for exactly
      # that reason, none of them about the plugin. The answer used to be a
      # Mailpit container attached to the wp-env network with a committed
      # mu-plugin routing SMTP at it, which fixed CI and left the same six
      # failing for anybody running the suite locally.
      #
      # phase3.php now captures mail in process on `pre_wp_mail`, so the
      # messages are readable with no container, no network and no difference
      # between here and a laptop.
      - name: Pin WordPress
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then
            core=null
          else
            core="\"https://wordpress.org/wordpress-${{ matrix.wp }}.zip\""
          fi

          cat > .wp-env.override.json <<JSON
          {
            "core": $core
          }
          JSON

          cat .wp-env.override.json

      - name: Start WordPress
        run: npx --yes @wordpress/env start --update

      # wp-env falls back to latest if it cannot fetch a pinned core, which
      # would turn "we tested 6.3" into "we tested whatever downloaded".
      - name: Confirm the version actually running
        run: |
          got=$(npx --yes @wordpress/env run tests-cli wp core version 2>/dev/null | tr -d '\r' | grep -oE '^[0-9.]+' | head -1)
          echo "running: $got, wanted: ${{ matrix.wp }}"

          if [ "${{ matrix.wp }}" != "latest" ] && [ "${got%.*}" != "${{ matrix.wp }}" ] && [ "$got" != "${{ matrix.wp }}" ]; then
            echo "::error::Wanted WordPress ${{ matrix.wp }} but got $got."
            exit 1
          fi

      # Each script exits non-zero on failure, so the shell's own error handling
      # is the assertion. Run one at a time rather than globbed, so a failure
      # names the file it came from.
      - name: Run the integration scripts
        run: |
          for script in tests/integration/*.php; do
            echo "── $script ──"
            npx --yes @wordpress/env run tests-cli \
              wp eval-file "wp-content/plugins/groundwork-common-post-portal/$script"
          done

      - name: Show the logs if something failed
        if: failure()
        run: npx --yes @wordpress/env logs tests --watch=false
