name: Deploy to WordPress.org

# WordPress.org publishes from Subversion, not from here. This copies a tagged
# release into that repository so a release is `git tag` and nothing else — no
# local SVN checkout, no hand-copied files, no chance of trunk and the tag
# drifting apart because a step was missed at eleven at night.
#
# ── What it needs, and what it works out for itself ──────────────────────────
# Two repository secrets, and only two:
#
#   SVN_USERNAME   your WordPress.org login
#   SVN_PASSWORD   your WordPress.org password
#
# Settings → Secrets and variables → Actions. WordPress.org has no deploy keys
# or scoped tokens for this; the plugin account's own credentials are what SVN
# authenticates against, which is a reason to have 2FA on that account and to
# keep these out of the workflow file.
#
# Everything else is derived. The SVN URL is
# plugins.svn.wordpress.org/<slug>/, the slug defaults to this repository's
# name — groundwork-common-post-portal, which is deliberately the same
# string — and the version comes from the tag. So none of it is written down
# here to go stale.
#
# ── What gets published ──────────────────────────────────────────────────────
# The action reads .distignore, the same file that builds the local zip. What
# reaches SVN trunk/ is therefore exactly what has been tested, and there is no
# second list of exclusions to keep in step with the first.
#
# .wordpress-org/ goes to SVN assets/ — screenshots, banner, icon. Those render
# the plugin's page on wordpress.org and are never downloaded by anyone
# installing it, which is why a large banner costs installers nothing.
#
# ── Before the first real run ────────────────────────────────────────────────
# This will fail until the plugin is approved, because the SVN repository does
# not exist until then. Use the manual trigger below with dry-run left on to
# rehearse it: everything runs except the commit.

on:
  release:
    types: [ published ]

  # Rehearsal, and the way to re-run a release that failed partway.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run everything except the commit'
        type: boolean
        default: true

permissions:
  contents: read

# ── One publish at a time, and never a cancelled one ────────────────────────
# Two settings here, and both are the opposite of what test.yml wants, for
# reasons worth writing down before somebody makes the two files agree.
#
# The group is a fixed string rather than `${{ github.ref }}`. Keying on the
# ref is the usual idiom and would be wrong here: every release carries a
# different tag, so a per-ref group puts two releases in two different groups
# and lets them run *concurrently* — which is the collision this exists to
# stop. Publishing 1.4.0 and 1.4.1 at the same time races two SVN commits
# against one repository, and the loser is whichever finishes second.
#
# `cancel-in-progress: false` because the thing being interrupted is a commit
# to somebody else's server. A cancelled run does not roll back the half of
# trunk/ it already wrote, and WordPress.org would then serve a release built
# from two versions. A queued second run costs three minutes; a partial
# publish costs a release to fix.
#
# What this does not buy is a queue. GitHub holds at most one run pending per
# group and cancels any earlier pending one, so publishing three releases
# inside a few minutes can drop the middle release's run before it starts.
# That is the accepted trade: a skipped publish is visible on the Actions tab
# and re-runnable from the manual trigger above, whereas two racing SVN
# commits are neither. Releases minutes apart are not a thing that happens
# here; two of them landing on WordPress.org at once only has to happen once.
#
# One more reason the group is spelled out rather than derived: it must not
# collide with the group in test.yml, which this workflow calls. GitHub's own
# guidance is to avoid identical concurrency groups in a caller and its called
# workflow, because the called run then cancels the run that started it. Inside
# that call `github.workflow` is *this* file's name — the github context in a
# reusable workflow is always the caller's — so test.yml's group evaluates to
# "Deploy to WordPress.org-refs/tags/…" during a release. Different string, no
# collision. Changing either group means checking the other.
concurrency:
  group: deploy-to-wordpress-org
  cancel-in-progress: false

jobs:
  # ── The gate ────────────────────────────────────────────────────────────────
  # test.yml, called against the tag being released, not a copy of it here. It
  # runs on pushes to main too, but a tag is not a push to main: the commit
  # under a tag is usually one that already went green, and "usually" is not a
  # property to publish on. A release is the one moment where being wrong is
  # expensive and unfixable without another release, so the suite runs again,
  # here, against exactly what is about to be published.
  #
  # This also covers the manual dry run, which is the point of a rehearsal.
  test:
    name: Tests
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # A red suite publishes nothing. GitHub skips this job if `test` fails or is
    # cancelled, so there is no path to the deploy step that does not go through
    # a green run first.
    needs: test

    steps:
      # Kept in step with the checkouts in test.yml on purpose; the note on
      # action versions in that file's header explains what is riding on it.
      - uses: actions/checkout@v7

      # The four values that must agree, checked before anything is published
      # rather than discovered afterwards by somebody reading a plugin page.
      # VersionTest enforces three of them against each other and now runs on
      # the tag itself via the `test` job above; this adds the one it cannot
      # see — that they match the tag being released. Getting this wrong ships a
      # version WordPress will not offer as an update, and fixing it means
      # another release.
      #
      # It costs a job to learn this, because it waits on the full suite first.
      # A mismatched tag is rare and fails safely, which is the cheaper trade
      # than a second checkout job racing the tests to say the same thing.
      - name: Check the tag matches the plugin
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          header=$(grep -m1 -oE '^ \* Version:[[:space:]]*\S+' groundwork-common-post-portal.php | awk '{print $NF}')
          stable=$(grep -m1 -oE '^Stable tag:[[:space:]]*\S+' readme.txt | awk '{print $NF}')
          constant=$(grep -m1 -oE "GWC_PP_VERSION[[:space:]]*=[[:space:]]*'[^']+'" groundwork-common-post-portal.php | grep -oE "'[^']+'" | tr -d "'")

          echo "tag=$tag header=$header stable=$stable constant=$constant"

          for value in "$header" "$stable" "$constant"; do
            if [ "$value" != "$tag" ]; then
              echo "::error::Tag $tag does not match the plugin ($header / $stable / $constant). Nothing published."
              exit 1
            fi
          done

      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
